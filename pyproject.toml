[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant-agent"
version = "0.1.0"
description = "Literature-review agent: SPECTER2 retrieve-then-rerank and grounded paper extraction"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "faiss-cpu",
    "torch",
    "transformers",
    "adapters>=1.2,<2",
    "sentencepiece",
    "pydantic>=2",
    "python-dotenv",
    "httpx",
    "pymupdf",
    "pylatexenc",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
research-assistant-ui = "research_assistant.ui.server:main"
retrieve-papers = "research_assistant.retrieval.cli:main"
extract-papers = "research_assistant.extraction.cli:main"
write-review = "research_assistant.writing.cli:main"
synthesize-papers = "research_assistant.synthesis.cli:main"

[tool.setuptools.packages.find]
include = ["research_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"research_assistant.ui" = ["static/*.html", "static/*.css", "static/*.js"]
